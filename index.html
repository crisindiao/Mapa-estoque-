<script>
const { useEffect, useRef, useState, useMemo, useCallback } = React;
const h = React.createElement;

/* =========================================================================
   CONSTANTES DE LAYOUT
   ========================================================================= */
const COL_SPACING   = 1.35;   // largura de cada posição (coluna) no eixo Z
const LEVEL_HEIGHT  = 1.9;    // altura de cada nível
const RACK_DEPTH    = 1.15;   // profundidade da estrutura da estante
const AISLE_WIDTH   = 3.4;    // largura do corredor entre duas ruas
const CORRIDOR_GAP  = 2.6;    // espaço entre corredores
const BASE_LEVEL_Y  = 0.15;
const BEAM_THICK    = 0.08;
const POST_SIZE     = 0.12;
const BLOCK_GAP     = 18;     // espaço entre o galpão principal e o bloco fictício
const COLUMN_TAG_STEP = 5;    // a cada quantas colunas colocar uma plaquinha numerada

const ITEM_FIELDS = ["cliente","codigo","desc","qtde","lote","validade","vencido","perecivel","danificado","giroScore","familia"];
function itemToObj(arr){ const o = {}; ITEM_FIELDS.forEach((k,i)=>o[k]=arr[i]); return o; }

/* =========================================================================
   COR POR GIRO (velocidade de movimentação do estoque)
   ========================================================================= */
function giroColor(g){
  const fast = new THREE.Color(0x2e8b57);
  const mid  = new THREE.Color(0xe8a13a);
  const slow = new THREE.Color(0xc0392b);
  const out  = new THREE.Color();
  return g < 0.5 ? out.copy(fast).lerp(mid, g*2) : out.copy(mid).lerp(slow, (g-0.5)*2);
}
const COLOR_VENCIDO_DANIFICADO = new THREE.Color(0xe63946); // vermelho sólido: vencido, danificado E a vencer (unificado a pedido)
const COLOR_VENCE_7D           = new THREE.Color(0xff8c1a); // laranja: usado só no contorno pulsante passivo (sem filtro ativo)
const COLOR_VENCE_15D          = new THREE.Color(0xf0c419); // amarelo: usado só no contorno pulsante passivo (sem filtro ativo)
const COLOR_CLIENTE_DESTAQUE   = new THREE.Color(0xffd400); // amarelo sólido de destaque do filtro Cliente
const COLOR_VAZIO              = new THREE.Color(0xffffff); // branco sólido para posições vazias
const COLOR_HOVER              = new THREE.Color(0xffffff);
const COLOR_SELECT             = new THREE.Color(0x2e6f77);
const COLOR_PALLET             = new THREE.Color(0xc9a06a); // madeira do palete
const COLOR_PAPELAO             = [ new THREE.Color(0xcaa06e), new THREE.Color(0xc2925c), new THREE.Color(0xd4b380), new THREE.Color(0xb98c56) ]; // variações de papelão

// paleta do filtro Família — categorias REAIS da planilha (BRINDE, VESTUARIO,
// DISPLAY, PRODUTO, GRÁFICO). Cores sólidas distintas, no mesmo espírito visual
// da legenda por blocos de cor do PDF, mas aplicadas às categorias verdadeiras
// do WMS (a planta não amarra zona sanitária a posição, então não dá pra usar
// as cores dela sem inventar dados).
const FAMILIA_CORES = {
  "BRINDE":    "#2e8b57",
  "VESTUARIO": "#c9781f",
  "DISPLAY":   "#2255aa",
  "PRODUTO":   "#c2298a",
  "GRÁFICO":   "#3aa7a0",
  "":          "#888888"
};
function corFamilia(fam){
  return FAMILIA_CORES[fam] || "#888888";
}

/* =========================================================================
   ALERTA PREDITIVO DE VALIDADE
   Em vez de só marcar "vencido" quando já venceu, calculamos quantos dias
   faltam para o vencimento e classificamos em faixas de risco. Aceita datas
   em formato DD/MM/AAAA ou AAAA-MM-DD (cobre os formatos mais comuns de
   planilha/ERP brasileiro).
   ========================================================================= */
// helper tolerante: aceita true, "true", "TRUE", 1, "1" como verdadeiro
// (dados reais de planilha/ERP às vezes não vêm como booleano estrito)
function isTruthy(v){
  if(v === true || v === 1) return true;
  if(typeof v === "string") return v.trim().toLowerCase() === "true" || v.trim() === "1";
  return false;
}
function parseValidade(str){
  if(!str) return null;
  const s = String(str).trim();
  let d;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    d = new Date(s.slice(0,10) + "T00:00:00");
  } else if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const [dd,mm,yy] = s.split("/").map(Number);
    d = new Date(yy < 100 ? 2000+yy : yy, mm-1, dd);
  } else {
    return null;
  }
  return isNaN(d.getTime()) ? null : d;
}
const MS_DIA = 86400000;
function diasParaVencer(validadeStr, hoje){
  const d = parseValidade(validadeStr);
  if(!d) return null;
  return Math.round((d.getTime() - hoje.getTime()) / MS_DIA);
}
// classifica um item em: "vencido" | "critico" (<=7d) | "atencao" (<=15d) | null (ok/sem data)
function riscoValidadeItem(it, hoje){
  if(isTruthy(it[6])) return "vencido"; // já vencido conforme flag do sistema
  const dias = diasParaVencer(it[5], hoje);
  if(dias === null) return null;
  if(dias < 0) return "vencido";
  if(dias <= 7) return "critico";
  if(dias <= 15) return "atencao";
  return null;
}
// pior risco entre os itens de uma posição
function riscoValidadePosicao(itens, hoje){
  let pior = null;
  const ordem = { vencido:3, critico:2, atencao:1 };
  itens.forEach(it=>{
    const r = riscoValidadeItem(it, hoje);
    if(r && (!pior || ordem[r] > ordem[pior])) pior = r;
  });
  return pior;
}

/* =========================================================================
   IMPORTAÇÃO DE PLANILHA DO ERP (.xls / .xlsx / .csv)
   O usuário seleciona o arquivo que sempre sobe pra atualizar o saldo; aqui a
   gente lê ele no próprio navegador (via SheetJS) e converte cada linha
   (item/lote) para o formato que o app já usa: um array de POSIÇÕES, cada
   uma com sua lista de itens.
   ========================================================================= */
// aceita "Sim"/"S" (com ou sem acento/maiúscula) como verdadeiro
function isSimOuS(v){
  return String(v||"").trim().toLowerCase().startsWith("s");
}
// converte célula de data (Date do SheetJS ou texto) para "AAAA-MM-DD".
// A planilha do ERP exporta datas no padrão americano MM/DD/AAAA (confirmado
// pelos exemplos com dia > 12, ex.: 10/31/2026), por isso a leitura de texto
// assume MM/DD/AAAA. Se um dia vier trocado, é só avisar que eu ajusto.
function erpDateToIso(val){
  if(val instanceof Date && !isNaN(val)){
    const y=val.getFullYear(), m=String(val.getMonth()+1).padStart(2,"0"), d=String(val.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+d;
  }
  const s = String(val||"").trim();
  if(!s) return "";
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // MM/DD/AAAA
  if(m) return m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // já em ISO
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  return "";
}
// extrai o primeiro número de um texto (ex.: " '11" -> 11)
function parseIntLoose(v){
  const m = String(v||"").match(/\d+/);
  return m ? parseInt(m[0],10) : 0;
}
// junta as linhas (uma por item/lote) em posições, no formato { pos, rua,
// col, niv, giro, itens:[[...]] } que o resto do app já espera
function convertErpRowsToPositions(rows){
  const byPos = new Map();
  rows.forEach(row=>{
    const posId = String(row["id_posicao"]||"").trim();
    if(!posId) return;
    let rua = String(row["pratel_en"]||"").trim();
    let col = parseIntLoose(row["coluna_en"]);
    let niv = parseIntLoose(row["altura_en"]);
    if(!rua || !col || !niv){
      const parts = posId.split(".");
      if(parts.length>=3){
        rua = rua || parts[0];
        col = col || parseInt(parts[1],10) || 0;
        niv = niv || parseInt(parts[2],10) || 0;
      }
    }
    const diasSemMov = parseFloat(row["Dias sem Mov Fiscal"]) || 0;
    const giroScore = Math.min(1, diasSemMov/365); // >=365 dias parado = giro 1 (bem lento)
    const item = [
      String(row["cod_cli"]||"").trim(),         // cliente
      String(row["Codigo"]||"").trim(),           // codigo
      String(row["descricao"]||"").trim(),        // desc
      parseFloat(row["Qtde"]) || 0,                // qtde
      String(row["cod_lot_fm"]||"").trim(),        // lote
      erpDateToIso(row["dat_val_fm"]),             // validade (ISO)
      false,                                        // vencido: calculado pelo app a partir da validade
      isSimOuS(row["Perecivel"]),                  // perecivel
      isSimOuS(row["Danificado"]),                 // danificado
      giroScore,                                    // giroScore
      String(row["Familia"]||"").trim()             // familia (BRINDE, VESTUARIO, DISPLAY, PRODUTO, GRÁFICO...)
    ];
    if(!byPos.has(posId)) byPos.set(posId, { pos:posId, rua, col, niv, itens:[], _giroSum:0, _giroCount:0 });
    const p = byPos.get(posId);
    p.itens.push(item);
    p._giroSum += giroScore;
    p._giroCount++;
  });
  return Array.from(byPos.values()).map(p=>({
    pos:p.pos, rua:p.rua, col:p.col, niv:p.niv,
    giro: p._giroCount ? p._giroSum/p._giroCount : 0,
    itens: p.itens
  }));
}
// lê o arquivo selecionado (.xls/.xlsx/.csv) e devolve o array de posições pronto
async function readErpFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:"array", cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:"", raw:true });
  const positions = convertErpRowsToPositions(rows);
  if(!positions.length) throw new Error("Nenhuma posição válida encontrada nessa planilha.");
  return positions;
}

/* =========================================================================
   IA DO ESTOQUE (Gemini, grátis)
   Em vez de mandar o estoque inteiro (pode ter dezenas de milhares de itens)
   pro modelo, a gente manda um RESUMO agregado (totais, top clientes, ruas)
   mais, se a pergunta citar uma posição ou código de cliente específico, os
   dados detalhados só daquele recorte. Isso mantém a resposta rápida e
   barata mesmo no plano gratuito.
   ========================================================================= */
function buildEstoqueSummary(data){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  let totalItens = 0, vencidos = 0, criticos = 0, atencao = 0, danificados = 0;
  const porCliente = new Map();
  const porRua = new Map(); // rua -> { posicoesOcupadas, itens, vencidos, criticos, atencao, danificados }
  data.forEach(p=>{
    if(!porRua.has(p.rua)) porRua.set(p.rua, { rua:p.rua, posicoesOcupadas:0, itens:0, vencidos:0, criticos:0, atencao:0, danificados:0 });
    const r = porRua.get(p.rua);
    r.posicoesOcupadas++;
    p.itens.forEach(it=>{
      totalItens++;
      r.itens++;
      const obj = itemToObj(it);
      const cli = String(obj.cliente||"").trim() || "(sem cliente)";
      if(!porCliente.has(cli)) porCliente.set(cli, { cliente:cli, itens:0, qtde:0, vencidos:0, danificados:0, ruas:new Set() });
      const c = porCliente.get(cli);
      c.itens++; c.qtde += Number(obj.qtde)||0; c.ruas.add(p.rua);
      const risco = riscoValidadeItem(it, hoje);
      if(risco === "vencido"){ vencidos++; c.vencidos++; r.vencidos++; }
      else if(risco === "critico"){ criticos++; r.criticos++; }
      else if(risco === "atencao"){ atencao++; r.atencao++; }
      if(isTruthy(obj.danificado)){ danificados++; c.danificados++; r.danificados++; }
    });
  });
  // ranking de clientes: por volume de itens, e separado por quem tem mais problemas
  // (isso deixa a IA capaz de responder perguntas de priorização sem precisar do detalhe item a item)
  const clientesArr = Array.from(porCliente.values()).map(c=>({ ...c, ruas: Array.from(c.ruas) }));
  const topClientesPorQtdItens = [...clientesArr].sort((a,b)=>b.itens-a.itens).slice(0,20);
  const topClientesPorVencidos = [...clientesArr].filter(c=>c.vencidos>0).sort((a,b)=>b.vencidos-a.vencidos).slice(0,15);
  const topClientesPorDanificados = [...clientesArr].filter(c=>c.danificados>0).sort((a,b)=>b.danificados-a.danificados).slice(0,15);
  const ruasArr = Array.from(porRua.values());
  const ruasComMaisAlertas = [...ruasArr].sort((a,b)=>(b.vencidos+b.criticos+b.danificados)-(a.vencidos+a.criticos+a.danificados)).slice(0,15);
  return {
    totalPosicoes: data.length, totalItens, totalClientes: porCliente.size,
    itensVencidos: vencidos, itensVenceEm7Dias: criticos, itensVenceEm15Dias: atencao,
    itensDanificados: danificados,
    topClientesPorQtdItens, topClientesPorVencidos, topClientesPorDanificados,
    posicoesOcupadasPorRua: ruasArr.map(r=>({ rua:r.rua, posicoesOcupadas:r.posicoesOcupadas })),
    ruasComMaisAlertas
  };
}
// se a pergunta citar um código de posição ou de cliente que existe nos
// dados, devolve só aquele recorte (evita ter que mandar tudo). A busca é
// tolerante: aceita token parcial/contido no nome do cliente, não só igualdade
// exata, para a IA conseguir responder mesmo quando a pergunta usa parte do
// nome, abreviação ou minúsculas.
function findRelevantSlice(data, question){
  const qUpper = String(question||"").toUpperCase();
  const tokens = qUpper.match(/[A-Z0-9.\-]{2,}/g) || [];
  if(!tokens.length) return null;
  const tokenSet = new Set(tokens);

  // 1) match exato de código de posição
  const posMatches = data.filter(p=>tokenSet.has(String(p.pos).toUpperCase()));
  if(posMatches.length){
    return { tipo:"posicoes", dados: posMatches.slice(0,15).map(p=>({
      pos:p.pos, rua:p.rua, col:p.col, niv:p.niv, itens:p.itens.map(itemToObj)
    })) };
  }

  // 2) match de rua específica (ex.: "rua 5", "corredor A")
  const ruaTokenMatch = qUpper.match(/\b(?:RUA|CORREDOR)\s+([A-Z0-9]{1,4})\b/);
  if(ruaTokenMatch){
    const ruaAlvo = ruaTokenMatch[1];
    const posDaRua = data.filter(p=>String(p.rua).toUpperCase()===ruaAlvo);
    if(posDaRua.length){
      return { tipo:"itensDaRua", dados: posDaRua.slice(0,40).map(p=>({
        pos:p.pos, col:p.col, niv:p.niv, itens:p.itens.map(itemToObj)
      })) };
    }
  }

  // 3) match de cliente: primeiro tenta igualdade exata do nome inteiro do
  // cliente com algum token da pergunta; se não achar nada, tenta match
  // parcial (nome do cliente contém o token, ou vice-versa)
  const clienteMatches = [];
  data.forEach(p=>{
    p.itens.forEach(it=>{
      const obj = itemToObj(it);
      const cliUpper = String(obj.cliente||"").toUpperCase().trim();
      if(!cliUpper) return;
      if(tokenSet.has(cliUpper)){
        clienteMatches.push({ pos:p.pos, rua:p.rua, ...obj });
      }
    });
  });
  if(clienteMatches.length) return { tipo:"itensDoCliente", dados: clienteMatches.slice(0,80) };

  const clienteParcial = [];
  const tokensLongos = tokens.filter(t=>t.length>=3);
  if(tokensLongos.length){
    data.forEach(p=>{
      p.itens.forEach(it=>{
        const obj = itemToObj(it);
        const cliUpper = String(obj.cliente||"").toUpperCase().trim();
        if(!cliUpper) return;
        if(tokensLongos.some(t=>cliUpper.includes(t) || t.includes(cliUpper))){
          clienteParcial.push({ pos:p.pos, rua:p.rua, ...obj });
        }
      });
    });
  }
  if(clienteParcial.length) return { tipo:"itensDoClienteAproximado", dados: clienteParcial.slice(0,80) };

  // 4) match de lote/código de item (campo "codigo" ou "lote" do item)
  const codigoMatches = [];
  data.forEach(p=>{
    p.itens.forEach(it=>{
      const obj = itemToObj(it);
      const cod = String(obj.codigo||"").toUpperCase();
      const lote = String(obj.lote||"").toUpperCase();
      if((cod && tokenSet.has(cod)) || (lote && tokenSet.has(lote))){
        codigoMatches.push({ pos:p.pos, rua:p.rua, ...obj });
      }
    });
  });
  if(codigoMatches.length) return { tipo:"itensPorCodigoOuLote", dados: codigoMatches.slice(0,40) };

  return null;
}
// tenta vários modelos do Gemini em sequência: se um não existir/estiver
// indisponível (ex.: descontinuado), cai pro próximo automaticamente
const GEMINI_MODEL_CANDIDATES = [
  "gemini-2.5-flash",
  "gemini-2.5-flash-lite",
  "gemini-3-flash-preview",
  "gemini-3.1-flash-lite",
  "gemini-3.5-flash"
];
async function askGeminiSobreEstoque(apiKey, question, summary, slice, historico){
  const promptText =
    "Você é um analista sênior de estoque e armazenagem, ajudando o gestor de um galpão a interpretar os " +
    "dados do sistema. Responda sempre em português do Brasil, de forma direta e útil.\n\n" +
    "COMO USAR OS DADOS:\n" +
    "- O RESUMO GERAL cobre o estoque inteiro (totais, ranking de clientes por volume/vencidos/danificados, " +
    "ocupação e alertas por rua) — use-o para perguntas amplas, comparações, rankings, tendências e contas.\n" +
    "- Quando houver um bloco de DADOS ESPECÍFICOS, ele traz o recorte exato (posição, rua ou cliente) que a " +
    "pergunta parece estar citando — priorize-o para responder sobre itens, lotes ou posições individuais.\n" +
    "- Sinta-se livre para cruzar informações, somar, comparar e tirar conclusões práticas (ex.: priorização, " +
    "riscos, sugestões de ação) em vez de só repetir números soltos.\n" +
    "- Só diga que não é possível responder se o RESUMO e os DADOS ESPECÍFICOS realmente não cobrirem o que foi " +
    "perguntado; nesse caso explique rapidamente o que falta, sem inventar números.\n" +
    "- Formate como lista curta quando ajudar a leitura; senão, poucos parágrafos objetivos.\n\n" +
    "RESUMO GERAL DO ESTOQUE (JSON):\n" + JSON.stringify(summary) + "\n\n" +
    (slice ? "DADOS ESPECÍFICOS RELACIONADOS À PERGUNTA (JSON):\n" + JSON.stringify(slice) + "\n\n" : "") +
    (historico && historico.length ? "HISTÓRICO RECENTE DA CONVERSA:\n" + historico.map(m=>
      (m.role==="user" ? "Usuário: " : "Você: ") + m.text).join("\n") + "\n\n" : "") +
    "PERGUNTA ATUAL: " + question;

  let lastError = null;
  for(const model of GEMINI_MODEL_CANDIDATES){
    try{
      const res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
        {
          method: "POST",
          headers: { "Content-Type":"application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { temperature: 0.3, maxOutputTokens: 1536 } })
        }
      );
      if(!res.ok){ lastError = model + ": HTTP " + res.status; continue; }
      const json = await res.json();
      const text = json && json.candidates && json.candidates[0] && json.candidates[0].content &&
        json.candidates[0].content.parts && json.candidates[0].content.parts[0] &&
        json.candidates[0].content.parts[0].text;
      if(text) return { text, model };
      lastError = model + ": resposta vazia";
    }catch(e){
      lastError = model + ": " + (e.message||e);
    }
  }
  throw new Error("Nenhum modelo do Gemini respondeu. Último erro: " + lastError);
}

/* =========================================================================
   CLASSIFICAÇÃO: posições reais do galpão x posições fictícias/irregulares
   Regra: uma rua é considerada fictícia quando (a) o nome não é composto só
   por letras (ex.: "17") ou (b) sua maior coluna é muito menor que a mediana
   das demais ruas (ex.: "PI", que só vai até a coluna 12 enquanto o padrão
   do galpão vai até ~73/74). Além disso, posições isoladas cuja coluna foge
   muito do padrão dentro de uma rua real (ex.: "T.878.1") são destacadas
   como "extravio" e também vão para o bloco fictício.
   ========================================================================= */
function classifyEstoque(data){
  const byRua = new Map();
  data.forEach(pos=>{
    if(!byRua.has(pos.rua)) byRua.set(pos.rua, []);
    byRua.get(pos.rua).push(pos);
  });
  const ruaNames = Array.from(byRua.keys());
  const maxCols  = ruaNames.map(r => Math.max(...byRua.get(r).map(p=>p.col)));
  const sortedMaxCols = [...maxCols].sort((a,b)=>a-b);
  const median = sortedMaxCols[Math.floor(sortedMaxCols.length/2)] || 1;
  const smallRuaThreshold   = median * 0.5;
  const outlierColThreshold = median * 2.5;

  // Em vez de assumir que "rua real = só letras" (isso varia de galpão pra
  // galpão — aqui é o CONTRÁRIO: ruas reais são numéricas 01-32, e as
  // fictícias/irregulares usam letras: FR, SAC, HNK, AF...), detectamos
  // dinamicamente qual dos dois padrões de nome concentra a maior parte das
  // POSIÇÕES reais do estoque, e tratamos esse como o padrão "real".
  const isNumeric = name => /^\d+$/.test(name);
  let posicoesNumericas = 0, posicoesAlfa = 0;
  ruaNames.forEach(name=>{
    const n = byRua.get(name).length;
    if(isNumeric(name)) posicoesNumericas += n; else posicoesAlfa += n;
  });
  const padraoRealENumerico = posicoesNumericas >= posicoesAlfa;

  const realNames = [], ficticiaNames = [];
  ruaNames.forEach(name=>{
    const maxCol = Math.max(...byRua.get(name).map(p=>p.col));
    const seguePadrao = isNumeric(name) === padraoRealENumerico;
    if(!seguePadrao || maxCol < smallRuaThreshold) ficticiaNames.push(name);
    else realNames.push(name);
  });
  const ficticiaSet = new Set(ficticiaNames);

  const realPositions = [], ficticiaPositions = [], outlierPositions = [];
  data.forEach(pos=>{
    if(ficticiaSet.has(pos.rua)) ficticiaPositions.push(pos);
    else if(pos.col > outlierColThreshold) outlierPositions.push(pos);
    else realPositions.push(pos);
  });

  // reindexa as posições "extraviadas" numa rua sintética própria, dentro
  // de uma faixa de coluna sensata, preservando a posição original para exibição
  const extraviadas = outlierPositions.map((p,i)=>({
    ...p, origPos: p.pos, rua: "EXTRAVIO", col: i+1, niv: 1
  }));

  const sortRuaNames = arr => [...arr].sort((a,b)=> a.length - b.length || (a<b?-1:a>b?1:0));

  return {
    realRuas: sortRuaNames(realNames),
    ficticiaRuas: sortRuaNames(ficticiaNames).concat(extraviadas.length ? ["EXTRAVIO"] : []),
    realPositions,
    ficticiaPositions: ficticiaPositions.concat(extraviadas)
  };
}

/* =========================================================================
   MONTAGEM DOS CORREDORES (par esquerda/direita)
   A primeira rua da sequência ocupa somente o lado direito do primeiro
   corredor (ex.: rua "A" só tem lado direito), depois seguem pares normais.
   ========================================================================= */
function buildCorridors(orderedRuas){
  const corridors = [];
  if(!orderedRuas.length) return corridors;
  corridors.push({ left: null, right: orderedRuas[0] });
  for(let i=1; i<orderedRuas.length; i+=2){
    corridors.push({ left: orderedRuas[i], right: orderedRuas[i+1] !== undefined ? orderedRuas[i+1] : null });
  }
  return corridors;
}

function buildBlockLayout(orderedRuas, positions, originX){
  const corridors = buildCorridors(orderedRuas);
  const maxColByRua = {}, maxLevelByRua = {};
  positions.forEach(p=>{
    maxColByRua[p.rua]   = Math.max(maxColByRua[p.rua]   || 0, p.col);
    maxLevelByRua[p.rua] = Math.max(maxLevelByRua[p.rua] || 0, p.niv);
  });
  const corridorSpanX = AISLE_WIDTH + RACK_DEPTH*2 + CORRIDOR_GAP;
  const ruaX = {};
  corridors.forEach((c,i)=>{
    const centerX = originX + i*corridorSpanX;
    if(c.left)  ruaX[c.left]  = centerX - AISLE_WIDTH/2 - RACK_DEPTH/2;
    if(c.right) ruaX[c.right] = centerX + AISLE_WIDTH/2 + RACK_DEPTH/2;
  });
  const maxColOverall = Math.max(1, ...orderedRuas.map(r=>maxColByRua[r]||0));
  const totalWidth = corridors.length * corridorSpanX;
  const totalDepth = maxColOverall * COL_SPACING;
  return { ruas: orderedRuas, corridors, ruaX, maxColByRua, maxLevelByRua,
           corridorSpanX, totalWidth, totalDepth, maxColOverall, originX, positions };
}

// Posições vazias: para cada rua do bloco, gera as combinações col x nível
// que aparecem na grade mas não têm registro de item no estoque.json.
// (aproximação: assume grade cheia col x nível por rua, já que o arquivo só lista posições ocupadas)
function computeEmptySlots(layout){
  // usa (rua,col,niv) em vez da string "pos" para não ser enganado por
  // pequenas inconsistências de formatação no arquivo de origem (ex.: "PI.08.1" vs "PI.08.01")
  const occupied = new Set(layout.positions.map(p=>p.rua+"|"+p.col+"|"+p.niv));
  const empties = [];
  layout.ruas.forEach(rua=>{
    const maxCol = layout.maxColByRua[rua] || 0;
    const maxNiv = layout.maxLevelByRua[rua] || 0;
    for(let col=1; col<=maxCol; col++){
      for(let niv=1; niv<=maxNiv; niv++){
        if(!occupied.has(rua+"|"+col+"|"+niv)){
          const pos = rua + "." + String(col).padStart(2,"0") + "." + niv;
          empties.push({ pos, rua, col, niv });
        }
      }
    }
  });
  return empties;
}

const PALLET_HEIGHT = 0.14;
// quantos "níveis de empilhamento" mostrar, de acordo com quantos lotes/SKUs
// existem na posição — é uma representação GENÉRICA (não é a caixa real),
// só pra dar volume visual: pouco material = pouca caixa, muito material = pilha cheia.
function tierForItemCount(n){
  if(n<=0) return 0;
  if(n===1) return 1;
  if(n<=3) return 2;
  if(n<=6) return 3;
  return 4;
}
function tierTemplate(tier){
  if(tier<=0) return [];
  if(tier===1){
    const sy=LEVEL_HEIGHT*0.42;
    return [ {dx:0,dz:0,y0:sy/2, sx:RACK_DEPTH*0.5, sy, sz:COL_SPACING*0.5} ];
  }
  if(tier===2){
    const sy=LEVEL_HEIGHT*0.38;
    return [
      {dx:-RACK_DEPTH*0.19, dz:0, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.62},
      {dx: RACK_DEPTH*0.19, dz:0, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.62}
    ];
  }
  if(tier===3){
    const sy=LEVEL_HEIGHT*0.34;
    const out=[];
    [-1,1].forEach(sx=>[-1,1].forEach(sz=>{
      out.push({dx:sx*RACK_DEPTH*0.19, dz:sz*COL_SPACING*0.19, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.34});
    }));
    return out;
  }
  // tier 4: base 2x2 + 2 caixas no topo (pilha "cheia")
  const sy=LEVEL_HEIGHT*0.32;
  const out=[];
  [-1,1].forEach(sx=>[-1,1].forEach(sz=>{
    out.push({dx:sx*RACK_DEPTH*0.19, dz:sz*COL_SPACING*0.19, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.34});
  }));
  [-1,1].forEach(sx=>{
    out.push({dx:sx*RACK_DEPTH*0.19, dz:0, y0:sy*1.5, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.6});
  });
  return out;
}
function tierStackHeight(tier){
  const slots = tierTemplate(tier);
  return slots.reduce((m,s)=>Math.max(m, s.y0+s.sy/2), 0.15);
}
